<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nochess: Chess you sign yourself</title>
    <meta
      name="description"
      content="Play chess under your own key. Both players sign every game, so your games and your rating are yours to keep."
    />
    <link rel="icon" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/AtkinsonHyperlegibleNext.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("nochess:settings") ?? "{}");
        const theme = saved.theme ?? localStorage.getItem("nochess:theme") ?? "system";
        document.documentElement.dataset.theme =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
