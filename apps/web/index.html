    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nochess" />
    <meta property="og:title" content="Nochess · Chess you sign yourself" />
    <meta
      property="og:description"
      content="Free, open-source chess on Nostr. Both players sign every move under their own key, so your games and your rating are yours to keep."
    />
    <meta property="og:url" content="https://anchorman-lol.github.io/nochess/" />
    <meta property="og:image" content="https://anchorman-lol.github.io/nochess/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Nochess logo, the line “Chess you sign yourself.” and a chessboard after 1.e4 e5 2.Nf3 Nc6 3.Bc4."

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nochess · Chess you sign yourself" />
    <meta
      name="twitter:description"
      content="Free, open-source chess on Nostr. Both players sign every move under their own key, so your games and your rating are yours to keep."
    />
    <meta name="twitter:image" content="https://anchorman-lol.github.io/nochess/og.png" />
    <meta
      name="twitter:image:alt"
      content="The Nochess logo, the line “Chess you sign yourself.” and a chessboard after 1.e4 e5 2.Nf3 Nc6 3.Bc4."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["WebApplication", "VideoGame"],
        "name": "Nochess",
        "url": "https://anchorman-lol.github.io/nochess/",
        "description": "Free, open-source chess on Nostr. Both players sign every move under their own key, so your games and your rating are yours to keep.",
        "image": "https://anchorman-lol.github.io/nochess/og.png",
        "applicationCategory": "GameApplication",
        "genre": "Chess",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/anchorman-lol/nochess",
        "sameAs": ["https://github.com/anchorman-lol/nochess"]
      }
    </script>
    <link
      rel="preload"
      href="/fonts/AtkinsonHyperlegibleNext.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("nochess:settings") ?? "{}");
        const theme = saved.theme ?? localStorage.getItem("nochess:theme") ?? "system";
        document.documentElement.dataset.theme =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
